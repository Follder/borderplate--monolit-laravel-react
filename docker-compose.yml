services:
  db:
    image: mysql:8.0
    platform: linux/x86_64
    container_name: ${CONTAINER_NAME}-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: 'example'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'root'
    volumes:
      - ./storage/docker/db:/var/lib/mysql
    networks:
      - db-network

  app:
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
    container_name: ${CONTAINER_NAME}-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
      - ./docker/php/extend-php.ini:/usr/local/etc/php/conf.d/extend-php.ini
    ports:
      - "5173:5173"
    depends_on:
      - db
    networks:
      - db-network
      - webserver-network

  webserver:
    image: nginx:1.21.4-alpine
    container_name: ${CONTAINER_NAME}-webserver
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
      - ./storage/docker/logs/nginx/:/var/log/nginx/
    ports:
      - "80:80"
    networks:
      - webserver-network

networks:
  db-network:
    name: ${CONTAINER_NAME}-db-network
  webserver-network:
    name: ${CONTAINER_NAME}-webserver-network
